# Firebase App Hosting configuration — replaces vercel.json.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Secrets referenced below must be created in Cloud Secret Manager first:
#   firebase apphosting:secrets:set SECRET_NAME
# (the CLI prompts for the value and grants the App Hosting service
#  account access automatically)

runConfig:
  # Keep one instance warm — avoids cold-start lag for SA mobile users.
  minInstances: 1
  maxInstances: 4
  cpu: 1
  memoryMiB: 1024
  concurrency: 80

env:
  # ── Public (ship in the client bundle — not secret) ──────────────────────
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://twswbccbxitlhkmrvomm.supabase.co
    availability: [BUILD, RUNTIME]
