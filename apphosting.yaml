  # https://baseform-backend-xxxxx-ew.a.run.app
  - variable: BACKEND_URL
    value: https://baseform.onrender.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_BACKEND_URL
    value: https://baseform.onrender.com
